blueprint:
  name: Saugmeister – Neu in der Mediathek
  description: >
    Schickt eine Benachrichtigung aufs Handy, sobald Saugmeister einen Film, eine
    Serie oder einen Anime einsortiert hat (mit Titel, Folge und Poster), und wenn der
    JDownloader auf ein Captcha wartet (Antippen öffnet es in Saugmeister).


    **Einrichtung:** Nach dem Speichern die Webhook-Adresse zusammensetzen:
    `https://DEINE-HOME-ASSISTANT-ADRESSE/api/webhook/WEBHOOK-ID`
    (bei Home Assistant Cloud: Einstellungen → Home Assistant Cloud → Webhooks).
    Diese Adresse in Saugmeister beim eigenen Namen unter 🔔 eintragen.
  domain: automation
  source_url: https://github.com/2pac1991/mediasort/blob/main/homeassistant/mediasort-benachrichtigung.yaml
  input:
    webhook_id:
      name: Webhook-ID
      description: >
        Ein langer, zufälliger Name, den niemand erraten kann (z. B. mediasort-x7k2p9q4m1).
        Er ist Teil der Adresse, die du in Saugmeister einträgst.
      selector:
        text: {}
    notify_device:
      name: Handy
      description: Das Gerät mit der Home-Assistant-App, das benachrichtigt werden soll.
      selector:
        device:
          filter:
            - integration: mobile_app
    open_url:
      name: Saugmeister-Adresse (optional)
      description: Wird beim Antippen der Benachrichtigung geöffnet, z. B. https://mediasort.tail780db.ts.net/
      default: ""
      selector:
        text:
          type: url

mode: queued
max: 10

triggers:
  - trigger: webhook
    webhook_id: !input webhook_id
    allowed_methods:
      - POST
    # Saugmeister läuft bei einem Freund, also nicht im eigenen Heimnetz
    local_only: false

variables:
  open_url: !input open_url
  anzahl: "{{ trigger.json.count | default(0) | int(0) }}"
  eintraege: "{{ trigger.json['items'] | default([]) }}"
  ist_captcha: "{{ trigger.json.type | default('') == 'captcha' }}"
  ziel: "{{ (open_url | regex_replace('/+$', '')) ~ trigger.json.path if open_url and trigger.json.path is defined else open_url }}"
  poster: "{{ (eintraege | selectattr('poster') | map(attribute='poster') | first) | default('', true) }}"

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: >-
      {{ trigger.json.title if trigger.json.title is defined
         else ('🎬 Neu in der Mediathek' if anzahl == 1 else '🎬 ' ~ anzahl ~ ' neue Titel in der Mediathek') }}
    message: "{{ trigger.json.text | default(trigger.json.files | default([]) | join('\n'), true) }}"
    data:
      image: "{{ poster }}"
      url: "{{ ziel }}"
      clickAction: "{{ ziel }}"
      group: "{{ 'mediasort-captcha' if ist_captcha else 'mediasort' }}"
      # Captchas laufen nach ein paar Minuten ab: auch im Fokus-/Nicht-stören-Modus zeigen (iPhone)
      push:
        interruption-level: "{{ 'time-sensitive' if ist_captcha else 'active' }}"
